<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SmartBank – Karta ma'lumotlari</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#060E1C;
  --s1:#0E1F36;
  --s2:#132540;
  --s3:#1A2F4E;
  --bdr:rgba(255,255,255,0.06);
  --bdr2:rgba(255,255,255,0.1);
  --blue:#1D6FEB;
  --blue2:#3B8BFF;
  --green:#0ECB81;
  --red:#F6465D;
  --gold:#F0B90B;
  --purple:#9B51E0;
  --w:#E8F0FE;
  --muted:#5E7A9E;
  --muted2:#3A5470;
  --fn:'Plus Jakarta Sans',sans-serif;
}
html,body{min-height:100%;background:var(--bg);font-family:var(--fn);color:var(--w);}
*{-webkit-tap-highlight-color:transparent;}
::-webkit-scrollbar{display:none;}

.sbar{max-width:430px;margin:0 auto;display:flex;justify-content:space-between;padding:14px 20px 0;font-size:12px;font-weight:700;opacity:.6;}
.page{max-width:430px;margin:0 auto;padding:0 0 110px;}

/* TOPBAR */
.topbar{display:flex;align-items:center;gap:13px;padding:14px 20px 0;margin-bottom:20px;}
.back{width:40px;height:40px;border-radius:12px;background:var(--s1);border:1px solid var(--bdr);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;text-decoration:none;color:var(--w);flex-shrink:0;}
.topbar h1{font-size:18px;font-weight:800;letter-spacing:-.3px;}

/* PAGE TABS */
.ptabs{display:flex;gap:0;background:var(--s1);border-radius:13px;padding:3px;margin:0 20px 20px;}
.ptab{flex:1;padding:9px 5px;text-align:center;border-radius:10px;font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer;transition:all .2s;}
.ptab.on{background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;}

.tpanel{display:none;}
.tpanel.on{display:block;}

.sec{padding:0 20px;margin-bottom:20px;}
.sectit{font-size:14.5px;font-weight:700;margin-bottom:13px;}

/* ── CARD DISPLAY ── */
.card-hero{border-radius:22px;padding:22px;position:relative;overflow:hidden;margin:0 20px 14px;cursor:default;}
.ch-blocked{background:linear-gradient(140deg,#0D2348 0%,#1A1050 60%,#0D2348 100%);}
.ch-gold{background:linear-gradient(140deg,#2D1A00 0%,#4A2C00 55%,#2D1A00 100%);}
.card-hero::before{content:'';position:absolute;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.04);top:-65px;right:-45px;}
.card-hero::after{content:'';position:absolute;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.03);bottom:-45px;left:-25px;}

.ch-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;position:relative;z-index:1;}
.ch-name{font-size:14px;font-weight:800;}
.ch-name span{opacity:.55;}
.chip{width:34px;height:25px;border-radius:5px;background:linear-gradient(135deg,#c8970a,#f5d060);}
.chip.gr{background:linear-gradient(135deg,#555,#aaa);}
.blk-bdg{display:inline-flex;align-items:center;gap:4px;background:rgba(246,70,93,.18);border:1px solid rgba(246,70,93,.35);border-radius:7px;padding:3px 8px;font-size:10px;font-weight:700;color:#FF8090;margin-top:5px;}

.ch-bal-lbl{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:4px;position:relative;z-index:1;}
.ch-bal{font-size:26px;font-weight:900;letter-spacing:-.5px;margin-bottom:16px;position:relative;z-index:1;}
.ch-bal.blur{filter:blur(6px);opacity:.45;}
.ch-bot{display:flex;justify-content:space-between;align-items:flex-end;position:relative;z-index:1;}
.ch-num{font-size:13px;letter-spacing:2.5px;font-weight:600;opacity:.7;}
.ch-holder{font-size:10px;opacity:.4;margin-top:3px;text-transform:uppercase;letter-spacing:.8px;}
.ch-visa{font-size:18px;font-weight:900;font-style:italic;opacity:.75;}

/* blocked overlay on card */
.blk-ov{position:absolute;inset:0;border-radius:22px;background:rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;backdrop-filter:blur(2px);z-index:2;}
.blk-ov-ico{font-size:28px;}
.blk-ov-txt{font-size:13px;font-weight:800;color:#FF6B7A;}
.blk-ov-sub{font-size:10.5px;color:rgba(255,255,255,.3);}

/* ── CARD INFO ROWS ── */
.info-list{background:var(--s1);border-radius:18px;border:1px solid var(--bdr);overflow:hidden;}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--bdr);}
.info-row:last-child{border-bottom:none;}
.ir-lbl{font-size:12px;color:var(--muted);font-weight:600;}
.ir-val{font-size:13.5px;font-weight:700;text-align:right;}
.ir-val.red{color:var(--red);}
.ir-val.green{color:var(--green);}
.ir-val.gold{color:#FCD34D;}
.status-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:8px;font-size:11.5px;font-weight:700;}
.sc-red{background:rgba(246,70,93,.15);border:1px solid rgba(246,70,93,.3);color:#FF8090;}
.sc-green{background:rgba(14,203,129,.12);border:1px solid rgba(14,203,129,.25);color:#0ECB81;}

/* ── TURNOVER CARD ── */
.tover{background:linear-gradient(135deg,#063325,#084D35);border-radius:20px;padding:20px;border:1px solid rgba(14,203,129,.2);margin-bottom:12px;}
.to-lbl{font-size:10.5px;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:7px;}
.to-val{font-size:28px;font-weight:900;color:#2ECC71;letter-spacing:-.5px;margin-bottom:3px;}
.to-sub{font-size:11px;color:rgba(255,255,255,.35);}
.to-bar-bg{height:5px;border-radius:3px;background:rgba(255,255,255,.08);margin-top:14px;}
.to-bar-fill{height:5px;border-radius:3px;background:linear-gradient(to right,#0ECB81,#2ECC71);}
.to-bar-row{display:flex;justify-content:space-between;margin-top:5px;}
.to-bar-row span{font-size:10px;color:rgba(255,255,255,.3);}

/* ── STATS GRID ── */
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.sbox{background:var(--s1);border-radius:17px;padding:15px;border:1px solid var(--bdr);}
.sb-ico{font-size:20px;margin-bottom:7px;}
.sb-lbl{font-size:10.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px;}
.sb-v{font-size:15.5px;font-weight:800;}
.sb-v.gr{color:var(--green);}
.sb-v.re{color:var(--red);}
.sb-v.bl{color:var(--blue2);}
.sb-v.go{color:#FCD34D;}
.sb-s{font-size:10.5px;color:var(--muted);margin-top:2px;}

/* ── MINI CHART ── */
.mchart{background:var(--s1);border-radius:18px;padding:18px;border:1px solid var(--bdr);}
.mc-head{display:flex;justify-content:space-between;margin-bottom:14px;}
.mc-tit{font-size:13.5px;font-weight:700;}
.mc-sub{font-size:11.5px;color:var(--blue2);font-weight:700;}
.bars{display:flex;gap:5px;align-items:flex-end;height:70px;}
.bwrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;}
.bbar{width:100%;border-radius:5px;}
.blab{font-size:8.5px;color:var(--muted2);font-weight:600;}

/* ── TX LIST ── */
.txlist{}
.txi{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--bdr);}
.txi:last-child{border-bottom:none;}
.txico{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.txinfo{flex:1;min-width:0;}
.txn{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.txs{font-size:11.5px;color:var(--muted);margin-top:1.5px;}
.txr{text-align:right;flex-shrink:0;}
.txa{font-size:13.5px;font-weight:700;}
.txa.m{color:var(--red);}
.txa.p{color:var(--green);}
.txt{font-size:10.5px;color:var(--muted);margin-top:1.5px;}

/* ── SEND FORM ── */
.f-lbl{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:7px;}
.f-inp{width:100%;background:var(--s1);border:1.5px solid var(--bdr);border-radius:13px;color:var(--w);font-size:14.5px;font-family:var(--fn);padding:14px 15px;outline:none;transition:border-color .2s;margin-bottom:12px;}
.f-inp:focus{border-color:var(--blue2);}
.f-inp:disabled{opacity:.4;cursor:not-allowed;}
.f-inp::placeholder{color:rgba(94,122,158,.45);}
.amt-box{background:var(--s1);border-radius:18px;padding:20px;text-align:center;margin-bottom:12px;border:1.5px solid var(--bdr);}
.amt-box p{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:7px;}
.amt-box input{width:100%;background:transparent;border:none;font-size:36px;font-weight:900;color:var(--w);font-family:var(--fn);text-align:center;outline:none;}
.amt-box input::placeholder{color:rgba(232,240,254,.12);}
.amt-box input:disabled{opacity:.3;cursor:not-allowed;}
.amt-cur{font-size:12px;color:var(--muted);margin-top:3px;}
.qamts{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px;}
.qa{padding:8px 13px;background:rgba(29,111,235,.12);border:1px solid rgba(29,111,235,.25);border-radius:9px;font-size:12.5px;font-weight:700;color:var(--blue2);cursor:pointer;transition:background .15s;}
.qa:active{background:rgba(29,111,235,.25);}
.qa.dis{opacity:.3;cursor:not-allowed;pointer-events:none;}

/* BLOCKED WARNING */
.blk-warn{background:rgba(246,70,93,.1);border:1px solid rgba(246,70,93,.25);border-radius:14px;padding:14px 16px;display:flex;align-items:flex-start;gap:12px;margin-bottom:16px;}
.bw-ico{font-size:22px;flex-shrink:0;margin-top:1px;}
.bw-tit{font-size:13px;font-weight:700;color:#FF8090;margin-bottom:3px;}
.bw-sub{font-size:11.5px;color:rgba(255,255,255,.4);line-height:1.5;}

.btn-send{width:100%;padding:17px;background:linear-gradient(135deg,var(--blue),var(--purple));border:none;border-radius:15px;color:#fff;font-size:15.5px;font-weight:800;font-family:var(--fn);cursor:pointer;box-shadow:0 10px 28px rgba(29,111,235,.4);transition:transform .15s;display:flex;align-items:center;justify-content:center;gap:9px;}
.btn-send:active{transform:scale(.97);}
.btn-send:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}

/* contacts */
.contacts{display:flex;gap:11px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;}
.contact{display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0;cursor:pointer;}
.cav{width:50px;height:50px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:20px;transition:transform .15s;}
.cav:active{transform:scale(.9);}
.cn{font-size:10.5px;color:var(--muted);font-weight:600;white-space:nowrap;}

/* ── MODAL ── */
.mover{position:fixed;inset:0;background:rgba(6,14,28,.9);z-index:200;backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;}
.mover.sh{display:flex;}
.mbox{background:#0B1D35;border-radius:26px;padding:34px 26px;text-align:center;max-width:310px;width:90%;border:1px solid var(--bdr2);animation:pop .3s ease;}
@keyframes pop{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}
.m-ico{font-size:60px;margin-bottom:12px;}
.m-tit{font-size:20px;font-weight:800;margin-bottom:6px;}
.m-sub{color:var(--muted);font-size:13px;line-height:1.7;margin-bottom:22px;}
.m-btn{width:100%;padding:15px;background:linear-gradient(135deg,var(--blue),var(--purple));border:none;border-radius:13px;color:#fff;font-size:14.5px;font-weight:700;font-family:var(--fn);cursor:pointer;text-decoration:none;display:block;}

/* BOTTOM NAV */
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:100;background:rgba(6,14,28,.97);backdrop-filter:blur(24px);border-top:1px solid var(--bdr);display:flex;justify-content:space-around;align-items:center;padding:10px 0 26px;}
@media(max-width:430px){.bnav{left:0;right:0;transform:none;}}
.bn{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:5px 12px;text-decoration:none;color:var(--muted);transition:color .2s;}
.bn.on{color:var(--blue2);}
.bni{font-size:21px;}
.bnl{font-size:9.5px;font-weight:700;}
.bnctr{width:50px;height:50px;border-radius:15px;background:linear-gradient(135deg,var(--blue),var(--purple));display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;box-shadow:0 8px 22px rgba(29,111,235,.45);margin-top:-17px;text-decoration:none;color:#fff;}

.fi{animation:fi .45s ease both;}
@keyframes fi{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.msep{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:1.5px;padding:14px 0 10px;}
</style>
</head>
<body>

<div class="page">
  <div class="topbar fi">
    <a href="index.html" class="back">←</a>
    <h1 id="pageTitle">Karta ma'lumotlari</h1>
  </div>

  <!-- PAGE TABS -->
  <div class="ptabs fi">
    <div class="ptab on" onclick="showPTab('info')">Ma'lumot</div>
    <div class="ptab" onclick="showPTab('turnover')">Aylanma</div>
    <div class="ptab" onclick="showPTab('send')"> O'tkazma</div>
  </div>

  <!-- ===== TAB: CARD INFO ===== -->
  <div class="tpanel on" id="tp-info">

    <!-- CARD VISUAL -->
    <div class="card-hero fi" id="cardHero">
      <!-- filled by JS -->
    </div>

    <!-- INFO TABLE -->
    <div class="sec fi">
      <div class="info-list" id="infoList">
        <!-- filled by JS -->
      </div>
    </div>

    <!-- QUICK ACTIONS FOR THIS CARD -->
    <div class="sec fi" id="cardActions">
      <!-- filled by JS -->
    </div>

  </div>

  <!-- ===== TAB: TURNOVER ===== -->
  <div class="tpanel" id="tp-turnover">

    <div class="sec fi" id="turnoverContent">
      <!-- filled by JS -->
    </div>

  </div>

  <!-- ===== TAB: SEND ===== -->
  <div class="tpanel" id="tp-send">
    <div class="sec fi" id="sendContent">
      <!-- filled by JS -->
    </div>
  </div>

</div>

<!-- BOTTOM NAV -->
<div class="bnav">
  <a href="index.html" class="bn"><div class="bni"></div><div class="bnl">Asosiy</div></a>
  <div class="bn"><div class="bni"></div><div class="bnl">To'lovlar</div></div>
  <a href="transfer.html" class="bnctr on"></a>
  <div class="bn"><div class="bni"></div><div class="bnl">Tarix</div></div>
  <div class="bn"><div class="bni"></div><div class="bnl">Xizmatlar</div></div>
</div>

<!-- SUCCESS MODAL -->
<div class="mover" id="successModal">
  <div class="mbox">
    <div class="m-ico">✅</div>
    <div class="m-tit">Muvaffaqiyatli!</div>
    <div class="m-sub" id="modalMsg">Pul o'tkazildi!</div>
    <a href="index.html" class="m-btn">Bosh sahifaga</a>
  </div>
</div>

<script>
// ── CARD DATA ──
const CARDS = {
  '4182': {
    type: 'blocked',
    name: 'SmartBank VISA',
    nameHtml: 'Smart<span>Bank</span>',
    number: '•••• •••• •••• 1702',
    holder: 'Javoxir Sadullayev',
    balance: '91 432 800',
    balanceRaw: 91432800,
    brand: 'VISA',
    expiry: '09/27',
    status: 'blocked',
    cardClass: 'ch-blocked',
    chipClass: 'gr',
    balColor: '',
    brandColor: '',
    turnover: '1 109 727 560',
    income: '+680 500 000',
    outcome: '−429 227 560',
    txCount: '318',
    cashback: '+127 400',
  },
  '7741': {
    type: 'gold',
    name: 'SmartGold VISA',
    nameHtml: '<span style="color:#FCD34D;">Smart</span><span style="opacity:.55;color:#FCD34D;">Gold</span>',
    number: '•••• •••• •••• 7741',
    holder: 'Javoxir Sadullayev',
    balance: '680',
    balanceRaw: 680,
    brand: 'VISA',
    expiry: '12/28',
    status: 'active',
    cardClass: 'ch-gold',
    chipClass: '',
    balColor: 'color:#FCD34D;',
    brandColor: 'color:#FCD34D;',
    turnover: '42 500 000',
    income: '+45 000 000',
    outcome: '−2 500 000',
    txCount: '18',
    cashback: '+4 200',
  }
};

// ── READ URL PARAM ──
const params = new URLSearchParams(window.location.search);
const cardNum = params.get('card') || '4182';
const C = CARDS[cardNum] || CARDS['4182'];

document.getElementById('pageTitle').textContent = C.name;

// ── BUILD CARD HERO ──
const hero = document.getElementById('cardHero');
hero.className = 'card-hero fi ' + C.cardClass;

if(C.status === 'blocked'){
  hero.innerHTML = `
    <div class="ch-top">
      <div>
        <div class="ch-name">${C.nameHtml}</div>
        <div style="margin-top:5px;"><span class="blk-bdg">🔒 Bloklangan</span></div>
      </div>
      <div class="chip ${C.chipClass}"></div>
    </div>
    <div class="ch-bal-lbl" style="color:rgba(255,255,255,.35);">Balans</div>
    <div class="ch-bal blur" style="${C.balColor}">${C.balance} UZS</div>
    <div class="ch-bot">
      <div>
        <div class="ch-num">${C.number}</div>
        <div class="ch-holder">${C.holder}</div>
      </div>
      <div class="ch-visa" style="${C.brandColor}">${C.brand}</div>
    </div>
    <div class="blk-ov">
      <div class="blk-ov-ico">🔒</div>
      <div class="blk-ov-txt">Karta bloklangan</div>
      <div class="blk-ov-sub">Blokdan chiqarish uchun qo'ng'iroq qiling</div>
    </div>`;
} else {
  hero.innerHTML = `
    <div class="ch-top">
      <div class="ch-name">${C.nameHtml}</div>
      <div class="chip ${C.chipClass}"></div>
    </div>
    <div class="ch-bal-lbl" style="color:rgba(252,211,77,.45);">Balans</div>
    <div class="ch-bal" style="${C.balColor}">${C.balance} UZS</div>
    <div class="ch-bot">
      <div>
        <div class="ch-num" style="${C.brandColor ? 'color:rgba(252,211,77,.65);' : ''}">${C.number}</div>
        <div class="ch-holder" style="${C.brandColor ? 'color:rgba(252,211,77,.35);' : ''}">${C.holder}</div>
      </div>
      <div class="ch-visa" style="${C.brandColor}">${C.brand}</div>
    </div>`;
}

// ── BUILD INFO LIST ──
const statusHtml = C.status === 'blocked'
  ? `<span class="status-chip sc-red">🔒 Bloklangan</span>`
  : `<span class="status-chip sc-green">✓ Faol</span>`;

document.getElementById('infoList').innerHTML = `
  <div class="info-row"><span class="ir-lbl">Karta raqami</span><span class="ir-val">${C.number}</span></div>
  <div class="info-row"><span class="ir-lbl">Karta egasi</span><span class="ir-val">${C.holder}</span></div>
  <div class="info-row"><span class="ir-lbl">Muddati</span><span class="ir-val">${C.expiry}</span></div>
  <div class="info-row"><span class="ir-lbl">Balans</span><span class="ir-val ${C.status==='blocked'?'':'green'}">${C.balance} UZS</span></div>
  <div class="info-row"><span class="ir-lbl">Holat</span><span class="ir-val">${statusHtml}</span></div>
  <div class="info-row"><span class="ir-lbl">Karta turi</span><span class="ir-val">${C.name}</span></div>
  <div class="info-row"><span class="ir-lbl">Valyuta</span><span class="ir-val">UZS · O'zbek so'mi</span></div>`;

// ── CARD ACTIONS ──
const actionsEl = document.getElementById('cardActions');
if(C.status === 'blocked'){
  actionsEl.innerHTML = `
    <div style="background:rgba(246,70,93,.08);border:1px solid rgba(246,70,93,.2);border-radius:16px;padding:16px 17px;display:flex;gap:12px;align-items:flex-start;margin-bottom:12px;">
      <span style="font-size:22px;flex-shrink:0;">⚠️</span>
      <div>
        <div style="font-size:13px;font-weight:700;color:#FF8090;margin-bottom:3px;">Karta to'xtatilgan</div>
        <div style="font-size:11.5px;color:rgba(255,255,255,.35);line-height:1.55;">Ushbu karta hozirda bloklangan. Blokdan chiqarish uchun +998 71 200‑00‑00 raqamiga qo'ng'iroq qiling yoki yaqin filialga murojaat qiling.</div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:9px;">
      <div style="background:var(--s1);border-radius:14px;padding:14px;text-align:center;border:1px solid var(--bdr);cursor:pointer;">

// ── HELPERS ──
function fill(name, card){
  document.getElementById('toCard').value = card;
  document.getElementById('toName').value = name;
}
function setA(v){ document.getElementById('sendAmt').value = v; }

function doSend(){
  if(isBlocked) return;
  const amt = document.getElementById('sendAmt').value;
  const card = document.getElementById('toCard').value;
  const name = document.getElementById('toName').value;
  if(!card){ alert("Karta raqamini kiriting"); return; }
  if(!amt||amt<1000){ alert("To'g'ri summa kiriting (min 1 000 UZS)"); return; }
  const fmt = Number(amt).toLocaleString('ru-RU');
  document.getElementById('modalMsg').innerHTML =
    `<strong style="color:#2ECC71;">${fmt} UZS</strong> muvaffaqiyatli o'tkazildi!<br><span style="color:var(--muted);font-size:11.5px;">${name||card}</span>`;
  document.getElementById('successModal').classList.add('sh');
}

// ── TAB SWITCHER ──
function showPTab(name){
  document.querySelectorAll('.tpanel').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.ptab').forEach(t=>t.classList.remove('on'));
  document.getElementById('tp-'+name).classList.add('on');
  const m={info:0,turnover:1,send:2};
  document.querySelectorAll('.ptab')[m[name]]?.classList.add('on');
}
</script>
